# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/r-lib
            ~/.cache/R/pkgcache
            ~/Library/R
            C:/Users/runneradmin/AppData/Local/R/cache
          key: ${{ runner.os }}-r-check-${{ hashFiles('DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-r-check-

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev libx11-dev libxslt-dev
      
      - name: Install dependencies
        run: |
          install.packages("pak")
          install.packages(c("rcmdcheck", "mockery", "testthat", "withr"))
          pak::local_install_deps()
          pak::local_install()
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'