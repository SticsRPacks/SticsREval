name: Docker build check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          pull: true
          tags: stics-r-eval:ci
          cache-from: type=gha
          secrets: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test image
        run: |
          docker run --rm stics-r-eval:ci R -q -e "library(SticsREval); cat('SticsREval', as.character(packageVersion('SticsREval')), '\n')"
          docker run --rm stics-r-eval:ci quarto --version
          docker run --rm stics-r-eval:ci pandoc --version
